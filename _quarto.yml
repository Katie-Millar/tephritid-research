project:
  type: website
  output-dir: _site

website:
  title: "Tephritidae Research"
  description: "A structured review of tephritid fruit fly research by genus and species"
  image: "tephritids.jpeg"
  open-graph: true
  twitter-card:
    card-style: summary_large_image
    image: "tephritids.jpeg"
    title: "Tephritidae Research Database"
    description: "Interactive maps, research themes and papers on tephritid fruit fly research — 2026"

  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: research-map.qmd
        text: Research Map
      - href: themes-network.qmd
        text: Research Themes
      - text: Genera
        menu:
          - href: bactrocera.qmd
            text: "*Bactrocera*"
          - href: ceratitis.qmd
            text: "*Ceratitis*"
    right:
      - icon: github
        href: https://github.com/Katie-Millar

  sidebar:
    style: "docked"
    search: true
    contents:
      - section: "Overview"
        contents:
          - index.qmd
          - research-map.qmd
          - themes-network.qmd
      - section: "Genera"
        contents:
          - bactrocera.qmd
          - ceratitis.qmd

  search: true

  page-footer:
    left: "Tephritidae Research Group"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme: sandstone
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    number-sections: true
    smooth-scroll: true
    link-external-icon: true
    link-external-newwindow: true
    citations-hover: true

csl: apa.csl

execute:
  echo: false
  warning: false